# Layer 2 stack: Postgres warehouse + Redis (Celery broker/cache) + Airflow
# (webserver, scheduler, worker) + dedicated ETL Celery worker.
#
# All Airflow services share a custom image (Dockerfile.airflow) that bakes in
# pandas/sqlalchemy/psycopg2/redis/celery so containers start in seconds, not
# minutes.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: glpi-airflow:local
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Celery defaults to one worker process per CPU (12 here), and each prefork
    # child holds a full Airflow import (~700 MB) before it even forks the
    # `airflow tasks run --raw` subprocess that runs the ML libraries. On a small
    # Docker VM that OOM-kills the task with exit code 1 and no traceback.
    # 1 = one heavy task at a time; raise it only if the VM has memory to spare.
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "1"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: "change-me"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: "/opt/airflow"
    # Inside containers, 127.0.0.1 is the container itself. Rewrite to
    # host.docker.internal so the pipeline reaches the GLPI on the host.
    GLPI_BASE_URL: ${GLPI_BASE_URL_CONTAINER:-http://host.docker.internal:8080/api.php/v1}
    GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
    GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
    POSTGRES_URL: postgresql+psycopg2://glpi:glpi@postgres:5432/glpi_dw
    REDIS_URL: redis://redis:6379/0
    # Layer 3 — ML engine. SQLite-backed MLflow (a DB backend is REQUIRED for the
    # model registry / Production stage) with artifacts on the shared volume.
    MLFLOW_TRACKING_URI: sqlite:////opt/airflow/mlruns/mlflow.db
    MLFLOW_ARTIFACT_ROOT: file:/opt/airflow/mlruns/artifacts
    ML_MODEL_CACHE_DIR: /opt/airflow/.model_cache
  volumes:
    - ./etl/dags:/opt/airflow/dags/etl
    - ./ml_engine/dags:/opt/airflow/dags/ml_engine
    - ./etl:/opt/airflow/etl
    - ./ml_engine:/opt/airflow/ml_engine
    - ./glpi_connector:/opt/airflow/glpi_connector
    - mlruns:/opt/airflow/mlruns
    # NB: no volume over /opt/airflow/.model_cache — the French embedding model is
    # baked into the image (Dockerfile.airflow) so inference never re-downloads it.
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    # Without this, a Docker Desktop restart brings every other service back
    # but leaves the warehouse down, so the whole stack fails on connect.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["6379:6379"]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname a --lastname d \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: ["celery", "worker", "--celery-hostname", "airflow-worker@%h", "--pid", "/tmp/celery-worker.pid"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  glpi-etl-worker:
    <<: *airflow-common
    # Bypass the airflow-image entrypoint (which prepends `airflow` and
    # rejects plain `celery`) so we can run our own etl.tasks Celery worker.
    entrypoint: ["/home/airflow/.local/bin/celery"]
    command: ["-A", "etl.tasks", "worker", "--loglevel=info", "-Q", "celery"]
    working_dir: /opt/airflow
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Optional: MLflow UI over the file-based tracking store (no separate backend
  # DB needed — reads the same ./mlruns volume the DAGs write to).
  mlflow-ui:
    <<: *airflow-common
    command: ["mlflow", "ui", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////opt/airflow/mlruns/mlflow.db",
              "--default-artifact-root", "file:/opt/airflow/mlruns/artifacts"]
    ports: ["5000:5000"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Layer 4 — FastAPI backend. Own image (Dockerfile.api) because it needs
  # SQLAlchemy 2.x + asyncpg, which conflict with the Airflow image's SA 1.4.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: glpi-api:local
    # Single uvicorn worker in dev so the in-process WS broadcaster serves every
    # client from one process. In prod use the image's default (gunicorn, 4
    # workers) plus a Redis pub/sub fan-out — see README.
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_URL: postgresql+asyncpg://glpi:glpi@postgres:5432/glpi_dw
      REDIS_URL: redis://redis:6379/0
      API_JWT_SECRET: ${API_JWT_SECRET:-change-me-in-prod}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:4200}
      API_ACCESS_TOKEN_TTL_MIN: ${API_ACCESS_TOKEN_TTL_MIN:-30}
      API_REFRESH_TOKEN_TTL_DAYS: ${API_REFRESH_TOKEN_TTL_DAYS:-7}
      API_ALERT_POLL_SECONDS: ${API_ALERT_POLL_SECONDS:-10}
    volumes:
      - ./api:/app/api
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-logs:
  mlruns:
