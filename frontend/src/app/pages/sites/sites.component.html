<app-tab-scaffold
  title="Sites"
  subtitle="Volume et SLA par site géographique"
  [error]="error()"
  (retry)="load()"
>
  <div class="charts">
    <div class="chart-card card">
      <h3>Volume de tickets par site</h3>
      <div class="chart-body">
        <app-skeleton-loader *ngIf="loading()" variant="chart"></app-skeleton-loader>
        <app-bar-chart *ngIf="!loading()" [data]="barChart()"></app-bar-chart>
      </div>
    </div>
  </div>

  <app-data-table
    title="Détail des sites"
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    exportName="sites"
  ></app-data-table>
</app-tab-scaffold>
