<div class="kpi card">
  <div class="top">
    <span class="icon"><lucide-icon [name]="icon" [size]="18"></lucide-icon></span>
    <span class="delta" [class]="trendTone" *ngIf="delta != null">
      <lucide-icon [name]="trendIcon" [size]="13"></lucide-icon>
      {{ delta > 0 ? '+' : '' }}{{ delta }}%
    </span>
  </div>

  <div class="value mono">
    <span *ngIf="text != null; else counted">{{ text }}</span>
    <ng-template #counted>
      <span [countUp]="value" [decimals]="decimals" [suffix]="unit">0{{ unit }}</span>
    </ng-template>
  </div>
  <div class="label">{{ label }}</div>
</div>
